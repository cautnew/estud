# Terminates HTTP from clients/the load balancer and proxies PHP requests
# to the "app" (php-fpm) container. TLS is expected to be terminated
# upstream (load balancer/ingress) in most deployments; add a `listen 443
# ssl` server block with real certificates if this container is internet-
# facing directly.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVER_NAME $host;
        fastcgi_read_timeout 60s;
        fastcgi_intercept_errors off;
    }

    # Built Vite assets are content-hashed, so they're safe to cache
    # indefinitely.
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
