; Runs inside the "worker" image (see Dockerfile), as the www-data user —
; every path here must be writable by that user.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/var/www/html/storage/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Two worker processes on the default queue connection (Redis in
; production, see .env.production.example). --max-time recycles each
; worker hourly so long-running memory leaks (e.g. from third-party
; packages) don't accumulate; supervisor immediately restarts it.
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
numprocs=2
stopwaitsecs=3600
stdout_logfile=/var/www/html/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

; `schedule:work` replaces a host crontab entry — it blocks and fires due
; tasks (see routes/console.php) once a minute for as long as the
; container runs.
[program:laravel-scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

; Required for Pulse's "Servers" card (CPU/memory/disk usage). Harmless to
; leave running even if that card isn't used.
[program:pulse-check]
command=php /var/www/html/artisan pulse:check
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/pulse-check.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
