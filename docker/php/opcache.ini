; OPcache tuned for a production Laravel deployment. Values assume the app
; is deployed via `php artisan optimize` on release (config/routes/views
; cached), so validate_timestamps is safe to disable.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
