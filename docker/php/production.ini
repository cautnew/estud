; Baseline php.ini overrides for production. Adjust memory_limit/upload
; limits to match the real workload (PDF/Excel export and imports).
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On

memory_limit=256M
max_execution_time=60
post_max_size=32M
upload_max_filesize=32M

date.timezone=UTC
